version: '3.8'

services:
  # Frontend (React + Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_SOLANA_RPC_URL=${VITE_SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000}
      - VITE_NETWORK=${VITE_NETWORK:-mainnet-beta}
    depends_on:
      - backend
    networks:
      - dck-network
    restart: unless-stopped

  # Backend (Python FastAPI - placeholder)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/dcktools}
    depends_on:
      - redis
      - postgres
    networks:
      - dck-network
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - dck-network
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # PostgreSQL for data storage
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dcktools
    networks:
      - dck-network
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  dck-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
